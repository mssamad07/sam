[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sam-assistant"
version = "0.1.0"
description = "Sam: A serious, modular, cross-platform personal AI assistant for Windows and Android"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Sam Project Team" }
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "httpx>=0.27.0",
    "loguru>=0.7.2",
    "rich>=13.7.0",
    "python-dotenv>=1.0.1",
    "psutil>=5.9.8",
]

[project.optional-dependencies]
ai = [
    "google-genai>=0.1.0",
    "openai>=1.30.0",
]
windows = [
    "pywin32>=306; sys_platform == 'win32'",
    "send2trash>=1.8.3",
    "pywinauto>=0.6.8; sys_platform == 'win32'",
]
voice = [
    "edge-tts>=6.1.12",
    "sounddevice>=0.4.7",
    "numpy>=1.26.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["sam_core", "sam_capabilities", "sam_clients"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
